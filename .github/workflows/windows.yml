name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Bouwen
        run: dotnet build Kerstlampjes.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: Kerstlampjes-Windows
          path: out/Kerstlampjes.exe
